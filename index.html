<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vypni.to — Videokurz</title>
  <style>
    /* Reset and full-bleed PDF viewer */
    html,body{height:100%;margin:0;background:#222;}
    .pdf-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#111;}
    iframe,embed,object{width:100%;height:100%;border:0;display:block;}
    /* Small message overlay for users/browsers that block PDF in iframe */
    .fallback{position:fixed;left:0;right:0;bottom:0;padding:12px;background:rgba(0,0,0,0.6);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;z-index:999;}
    .btn{background:#ff6b35;color:#fff;padding:8px 12px;border-radius:6px;text-decoration:none;font-weight:600}
    .center-msg{max-width:900px;text-align:center}
    /* Make sure the PDF scales nicely on small screens */
    @media (max-width:700px){ .fallback{font-size:14px; padding:10px} }
  </style>
</head>
<body>
  <div class="pdf-wrap" role="main" aria-label="PDF obsah stránky">
    <!-- Primary embed: most browsers will render the PDF as full page -->
    <iframe src="vypnito.pdf" title="Vypni.to PDF" loading="eager"></iframe>

    <!-- Fallbacks in case iframe is blocked: object and embed -->
    <object data="vypnito.pdf" type="application/pdf" width="100%" height="100%">
      <embed src="vypnito.pdf" type="application/pdf" />
    </object>
  </div>

  <div class="fallback" aria-hidden="false">
    <div class="center-msg">
      Pokud se PDF nezobrazí (některé prohlížeče nebo bezpečnostní zásady to blokují), klikněte na tlačítko pro otevření PDF v nové záložce nebo stáhněte soubor a nahrajte ho spolu s tímto <code>index.html</code> do GitHub repozitáře.
      <div style="margin-top:10px">
        <a class="btn" href="vypnito.pdf" target="_blank" rel="noopener">Otevřít PDF v nové záložce</a>
        <a class="btn" href="vypnito.pdf" download style="margin-left:10px">Stáhnout PDF</a>
      </div>
    </div>
  </div>
</body>
</html>
